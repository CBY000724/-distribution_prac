<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#241710">
<title>네가 있어 따뜻했던 날들</title>
<style>
:root{color-scheme:dark;--ink:#fff5e4;--gold:#dbad73}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:clamp(10px,3vw,36px);background:#20140f;color:var(--ink);font-family:"Noto Serif KR","Batang",serif}
.card{isolation:isolate;position:relative;overflow:hidden;width:min(1120px,100%);min-height:min(740px,calc(100svh - 20px));display:grid;align-items:center;padding:clamp(36px,8vw,105px);border-radius:24px;background:#422c1e;box-shadow:0 30px 100px #100904aa}
.card::before,.card::after,.light{position:absolute;inset:0;pointer-events:none}
.card::before{content:"";z-index:-3;background:url("companion.jpg") 65% center/cover no-repeat;filter:sepia(.32) saturate(.85)}
.card::after{content:"";z-index:-2;background:linear-gradient(95deg,#24140efb 0%,#352219ee 28%,#44281bae 53%,#58341539 100%)}
.frame{position:absolute;inset:13px;border:1px solid #efc99370;border-radius:15px;pointer-events:none}
.light{z-index:-1;background:linear-gradient(118deg,transparent 39%,#ffe0a526 49%,transparent 61%);transform:translateX(-90%);animation:sweep 14s ease-in-out infinite}
.letter{width:min(100%,39rem);text-wrap:pretty}
.letter>*{animation:fall .95s cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--line,0)*230ms)}
.seal{display:grid;place-items:center;color:#f4cf99;width:42px;height:42px;border:1px solid #ecc68d88;border-radius:50%;font-size:18px}
h1{font-size:clamp(34px,5.8vw,75px);font-weight:500;line-height:1.2;letter-spacing:-.065em;margin:22px 0 25px}
p{font-size:clamp(15px,1.75vw,20px);line-height:1.95;margin:0 0 14px;color:#fff1e0}
.sign{margin-top:23px;color:#f2ca94}
button{margin-top:14px;padding:10px 16px;border:1px solid #efc99399;border-radius:100px;background:#26160ec9;color:var(--ink);font:500 14px system-ui;cursor:pointer;min-height:44px}
button:hover,button[aria-pressed="true"]{background:#66412a}
button:focus-visible{outline:2px solid #fff0cd;outline-offset:4px}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:-1}
.hearts span{position:absolute;bottom:0;left:var(--x);color:#f9ca8d;font-size:var(--size);opacity:0;animation:float 10s linear infinite;animation-delay:var(--delay)}
@keyframes fall{from{opacity:0;transform:translateY(-23px)}to{opacity:1;transform:translateY(0)}}
@keyframes sweep{0%,100%{transform:translateX(-90%)}55%,75%{transform:translateX(80%)}}
@keyframes float{0%{opacity:0;transform:translateY(0)}25%{opacity:.38}85%{opacity:.15}100%{opacity:0;transform:translate(30px,-310px)}}
@media(max-width:650px){
.card{padding:clamp(205px,36svh,320px) clamp(25px,7vw,46px) 34px;align-items:end}
.card::before{background-position:center 22%}
.card::after{background:linear-gradient(180deg,#39221b20 0%,#55382939 18%,#342018ba 39%,#25160ff9 59%)}
.letter{text-shadow:0 2px 12px #1d1009}
h1{margin:16px 0 18px}
p{margin-bottom:10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<main class="card">
<div class="frame" aria-hidden="true"></div><div class="light" aria-hidden="true"></div>
<div class="hearts" aria-hidden="true">
<span style="--x:65%;--size:12px;--delay:-2s">♥</span><span style="--x:75%;--size:17px;--delay:-6s">♥</span><span style="--x:89%;--size:10px;--delay:-4s">♥</span><span style="--x:95%;--size:14px;--delay:-8s">♥</span>
</div>
<article class="letter" aria-labelledby="title">
<div class="seal" aria-hidden="true">♥</div>
<h1 id="title" style="--line:1">네가 있어<br>따뜻했던 날들</h1>
<p style="--line:2">문을 열면 네가 달려오던 그 짧은 순간이<br>내겐 하루 중 가장 다정한 시간이었어.</p>
<p style="--line:3">말없이 내 곁에 앉아 주던 너와<br>아무 일도 없던 오후를 오래 기억할 거야.</p>
<p class="sign" style="--line:4">내 곁에 와 줘서 고마워. 많이 사랑해.</p>
<button id="music" type="button" aria-pressed="false" style="--line:5">♫ &nbsp; 음악 켜기</button>
</article>
</main>
<script>
const button = document.querySelector('#music');
const melody = [
  [72,0],[76,1],[79,2],[76,3],[74,4],[77,5],[81,6],[77,7],
  [76,8],[79,9],[84,10],[79,11],[77,12],[76,13],[74,14],[72,15]
];
const chords = [[48,55,64],[50,57,65],[45,52,60],[43,55,62]];
const beat = 0.58;
let context, output, timer, nextStart, playing = false, busy = false;

function note(pitch, time, length, volume) {
  const oscillator = context.createOscillator();
  const envelope = context.createGain();
  oscillator.type = 'sine';
  oscillator.frequency.value = 440 * 2 ** ((pitch - 69) / 12);
  envelope.gain.setValueAtTime(0.0001, time);
  envelope.gain.exponentialRampToValueAtTime(volume, time + 0.055);
  envelope.gain.exponentialRampToValueAtTime(0.0001, time + length);
  oscillator.connect(envelope).connect(output);
  oscillator.start(time);
  oscillator.stop(time + length);
}

function queuePhrase() {
  const now = context.currentTime;
  if (nextStart < now) nextStart = now + 0.06;
  if (nextStart > now + 0.6) return;
  melody.forEach(([pitch, step]) => note(pitch, nextStart + step * beat, 1.25, 0.082));
  chords.forEach((chord, bar) => chord.forEach((pitch, index) => {
    note(pitch, nextStart + (bar * 4 + index * 0.48) * beat, 2.1, 0.034);
  }));
  nextStart += 16 * beat;
}

button.addEventListener('click', async () => {
  if (busy) return;
  if (playing) {
    clearInterval(timer);
    const previousOutput = output;
    previousOutput.gain.setTargetAtTime(0, context.currentTime, 0.045);
    setTimeout(() => previousOutput.disconnect(), 300);
    playing = false;
  } else {
    busy = true;
    try {
      const AudioEngine = window.AudioContext || window.webkitAudioContext;
      context ??= new AudioEngine();
      await context.resume();
      output = context.createGain();
      output.gain.value = 0.82;
      output.connect(context.destination);
      nextStart = context.currentTime + 0.08;
      queuePhrase();
      timer = setInterval(queuePhrase, 200);
      playing = true;
    } catch {
      button.textContent = '음악 다시 시도';
      return;
    } finally {
      busy = false;
    }
  }
  button.setAttribute('aria-pressed', String(playing));
  button.textContent = playing ? '♫  음악 끄기' : '♫  음악 켜기';
});
</script>
</body>
</html>
